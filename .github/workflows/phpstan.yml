name: PHPStan

on:
  pull_request:
  merge_group:
  push:
    branches:
      - 'renovate/**'

jobs:
  phpstan:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sgoettsch/docker-phpstan:latest-php8.1@sha256:4c7046646570a9731afb40169d71de013d13fc4d3b9e9a5f0c12bc32577cb29b
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Composer
        run: composer install

      - name: PHPStan
        uses: docker://ghcr.io/sgoettsch/docker-phpstan:latest-php8.1@sha256:4c7046646570a9731afb40169d71de013d13fc4d3b9e9a5f0c12bc32577cb29b
        with:
          args: analyze --error-format=table /github/workspace
