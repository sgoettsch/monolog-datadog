name: PHPStan

on:
  pull_request:
  merge_group:
  push:
    branches:
      - 'renovate/**'

jobs:
  phpstan:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sgoettsch/docker-phpstan:latest-php8.1@sha256:f60ea6d4595d775241b0db84c1ac7d5bf6b51c1e9691ad2b0d7c9508fb7eea49
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Composer
        run: composer install

      - name: PHPStan
        uses: docker://ghcr.io/sgoettsch/docker-phpstan:latest-php8.1@sha256:f60ea6d4595d775241b0db84c1ac7d5bf6b51c1e9691ad2b0d7c9508fb7eea49
        with:
          args: analyze --error-format=table /github/workspace
