name: PHPStan

on:
  pull_request:
  merge_group:
  push:
    branches:
      - 'renovate/**'

jobs:
  phpstan:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sgoettsch/docker-phpstan:latest-php8.1@sha256:a88346a89e5239996a4fc03eed31b0e948d35df8003832c05a4ebe03ee58687c
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Composer
        run: composer install

      - name: PHPStan
        uses: docker://ghcr.io/sgoettsch/docker-phpstan:latest-php8.1@sha256:a88346a89e5239996a4fc03eed31b0e948d35df8003832c05a4ebe03ee58687c
        with:
          args: analyze --error-format=table /github/workspace
