name: PHPStan

on:
  pull_request:
  merge_group:
  push:
    branches:
      - 'renovate/**'

jobs:
  phpstan:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sgoettsch/docker-phpstan:latest-php8.1@sha256:9eb9fc3a1b2b241e46f463f5ad99af36fcb736ab20469eaf95a451366d0fee23
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Composer
        run: composer install

      - name: PHPStan
        uses: docker://ghcr.io/sgoettsch/docker-phpstan:latest-php8.1@sha256:9eb9fc3a1b2b241e46f463f5ad99af36fcb736ab20469eaf95a451366d0fee23
        with:
          args: analyze --error-format=table /github/workspace
