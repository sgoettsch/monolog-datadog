name: PHPStan

on:
  pull_request:
  merge_group:
  push:
    branches:
      - 'renovate/**'

jobs:
  phpstan:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sgoettsch/docker-phpstan:latest-php8.1@sha256:f69540de3ad6c952c4b0c3448150b63890b5d0d676d838594912608c8a5bcba9
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Composer
        run: composer install

      - name: PHPStan
        uses: docker://ghcr.io/sgoettsch/docker-phpstan:latest-php8.1@sha256:f69540de3ad6c952c4b0c3448150b63890b5d0d676d838594912608c8a5bcba9
        with:
          args: analyze --error-format=table /github/workspace
